# Directories whose CONTENTS are linked entry by entry into a destination that
# has to stay a real local directory -- because something else writes there too
# (state, logs, sockets, or files installed by packages). Everything under
# configs/ that is NOT listed here is linked as one whole directory instead, by
# the CONFIGS loop in dotbase/base.mk.
#
#   <source, relative to the repo>   <destination, $HOME expanded>
#
# Add a row to link a new one -- the Makefile needs no edit. A row under
# configs/ is also excluded from the whole-directory loop automatically.

# desktop entries shadowing the ones packages ship, for HiDPI scale factors,
# Wayland flags and extra instances; a file here wins over /usr/share
apps            $HOME/.local/share/applications

# mail and calendar sync units; the dir is owned by every other user service
systemd         $HOME/.config/systemd/user

# agent skills; the dir already holds skills installed from elsewhere
skills          $HOME/.claude/skills

# herdr keeps its server sockets, logs and session state beside its config
configs/herdr   $HOME/.config/herdr

# RIME writes build/, *.userdb, user.yaml, installation.yaml and sync/ here,
# none of which belongs in the repo
configs/rime    $HOME/.local/share/fcitx5/rime

# fcitx5 owns this directory: it writes clipboard.conf, xcb.conf and
# cached_layouts beside our classicui.conf, and rewrites profile from memory on
# exit -- which is why profile is not tracked here, only linked files are safe
configs/fcitx5/conf                 $HOME/.config/fcitx5/conf

# omarchy ships .sample hooks in these and adds more on update, so only the
# individual files can be linked. The template renders the candidate popup's
# colours on a theme switch; the hooks reload fcitx5 afterwards, and follow the
# system font, which lives in classicui.conf rather than the generated theme
configs/omarchy/themed              $HOME/.config/omarchy/themed
configs/omarchy/hooks/theme-set.d   $HOME/.config/omarchy/hooks/theme-set.d
configs/omarchy/hooks/font-set.d    $HOME/.config/omarchy/hooks/font-set.d

# omarchy installs the whole hypr config and rewrites parts of it on update, so
# only the two files we actually own can be linked. They are a pair:
# hyprland.lua sets omarchy_default_bindings = false, which is what lets
# bindings.lua replace only the tiling binds and re-require the rest. Compare
# hyprland.lua against /usr/share/omarchy/config/hypr/hyprland.lua after an
# omarchy update -- ours is that file plus the one flag.
# The sibling files here are the pre-omarchy monolith, deliberately not linked.
configs/hypr/overrides              $HOME/.config/hypr
