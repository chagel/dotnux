# Catppuccin Mocha. Bare hex, no leading '#': every surface wants it differently
# -- fuzzel takes rrggbbaa, hyprland packs alpha into rgba(hhhhhhaa), CSS wants
# decimal triples -- so templates add their own punctuation.
#
# Two layers on purpose. The palette block is the theme's own vocabulary; the
# roles block below is what templates actually reference, so a new theme only
# has to answer "what is the accent here", not know where accents get used.

# --- palette ---------------------------------------------------------------
rosewater=f5e0dc
flamingo=f2cdcd
pink=f5c2e7
mauve=cba6f7
red=f38ba8
maroon=eba0ac
peach=fab387
yellow=f9e2af
green=a6e3a1
teal=94e2d5
sky=89dceb
sapphire=74c7ec
blue=89b4fa
lavender=b4befe
text=cdd6f4
subtext1=bac2de
subtext0=a6adc8
overlay2=9399b2
overlay1=7f849c
overlay0=6c7086
surface2=585b70
surface1=45475a
surface0=313244
base=1e1e2e
mantle=181825
crust=11111b

# --- roles -----------------------------------------------------------------
# what templates reference
bg=1e1e2e
fg=cdd6f4
dim=7f849c
muted=45475a
accent=cba6f7
ok=a6e3a1
warn=f9e2af
urgent=f38ba8

# the bar sits on the wallpaper, so it is darker than the terminal ground
bar_bg=181825
bar_fg=cdd6f4
# background of the status-module group inside the bar
chip=313244

# hyprland's active border is the one gradient in the system; a theme that
# wants a flat border sets both stops the same
border_active_from=b4befe
border_active_to=cba6f7
border_inactive=45475a
shadow=11111b

# lock screen and the calendar chip in waybar-clock
lock_bg=11111b
cal_month=f9e2af
cal_weekday=a6e3a1
cal_day=94e2d5
cal_today=cba6f7
cal_ink=1e1e2e

# hues nvim needs beyond ok/warn/urgent
blue=89b4fa
cyan=89dceb
magenta=f5c2e7
orange=fab387
light_fg=bac2de
