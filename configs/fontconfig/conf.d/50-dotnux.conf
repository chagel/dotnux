<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ==========================================================
       Lives in conf.d/ rather than as fonts.conf because
       `omarchy font set` overwrites ~/.config/fontconfig/fonts.conf
       wholesale, and that path is this repo. fontconfig loads
       conf.d/ first and fonts.conf after, so the two compose:
       Omarchy prepends the chosen family to monospace with a strong
       binding, and the fallbacks below queue up behind it. The
       generated fonts.conf is gitignored.
       ========================================================== -->

  <!-- ==========================================================
       Generic family defaults.
       These are what every app falls back to when it has no font
       setting of its own: Electron (Teams), XWayland (WeChat),
       browsers, GTK/Qt dialogs.
       Change the FIRST <family> in each block to change the system
       font; the entries after it are CJK and emoji fallbacks.

       Hiragino Sans GB is a macOS font and is not packaged for Arch.
       It stays first among the CJK entries so it wins if it is ever
       installed (fontconfig skips a family it cannot find), with
       Noto CJK SC behind it as the fallback that actually resolves.
       SC, not the bare CJK family: Han unification means the KR and
       JP faces draw a subset of characters with Korean/Japanese
       glyph forms, which is what fc-match selects without this.
       ========================================================== -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Hiragino Sans GB</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
      <family>Hiragino Sans GB</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Hiragino Sans GB</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Map the "emoji" generic family so apps that ask for it by name
       (Chromium/Electron do) resolve to the color font. -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ==========================================================
       Emoji fallback for fonts that request a family directly.
       Without this, apps naming a specific font (rather than a
       generic) still render emoji as tofu.
       ========================================================== -->

  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>JetBrainsMono Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ==========================================================
       Rendering. "slight" hinting + rgb subpixel is the standard
       choice for a HiDPI laptop panel; it keeps glyph shapes intact
       rather than snapping stems to the pixel grid.
       ========================================================== -->

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Never synthesise oblique from an upright face; prefer a real
       italic or leave it upright. -->
  <match target="font">
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix><double>1</double><double>0</double>
                <double>0</double><double>1</double></matrix>
      </times>
    </edit>
  </match>

</fontconfig>
