# Ghostty settings omarchy has no opinion about.
#
# omarchy owns ~/.config/ghostty/config: it copies that file from
# $OMARCHY_PATH/config/ghostty/config, and omarchy-font-set and
# omarchy-display-text-size rewrite the font-family and font-size lines in it
# with plain `sed -i`, which renames a temp file over the target and would
# replace a symlink with a regular copy. So that file has to stay local, and
# this one is pulled into it by a second include:
#
#   config-file = ?"local.conf"
#
# Relative config-file paths resolve against ~/.config/ghostty, the `?` makes a
# missing file non-fatal, and a later include wins over an earlier one -- so
# keep font-family and font-size out of here and let omarchy keep driving them.
# Colours arrive the same way, from the themed ghostty.conf omarchy renders.

# no-hinting keeps the stems from snapping to the pixel grid, which on a 4K
# panel at scale 1.5 reads as uneven weight; thickening puts the body back.
font-thicken = true
font-thicken-strength = 128
freetype-load-flags = no-hinting
adjust-cell-height = 5%
alpha-blending = native
