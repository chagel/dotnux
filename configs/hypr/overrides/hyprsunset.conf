# Night light schedule. hyprsunset walks these profiles in time order and
# applies the last one whose time has already passed today, so it lands on the
# right temperature at launch as well as at each boundary -- no timer, no cron.
#
# It only reaches these profiles while it is RUNNING, which is what the
# o.launch_on_start("hyprsunset") line in autostart.lua is for.

# Daylight. identity leaves the monitor untouched rather than applying
# hyprsunset's own default tint, which is what a bare profile would do.
profile {
    time = 07:00
    identity = true
}

# Evening. 4000K is the same value omarchy-toggle-nightlight and the bar's
# nightlight widget use, so a scheduled evening reads as "on" in the bar too.
profile {
    time = 20:00
    temperature = 4000
}

# SUPER+CTRL+N (or the bar widget) still overrides by hand: the toggle sets the
# temperature directly, and it holds until the next profile boundary comes
# round -- so an override is always scoped to the current half of the day.
