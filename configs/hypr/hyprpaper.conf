# Wallpaper daemon, started from hyprland.lua.
#
# hyprpaper 0.8.x replaced the old flat syntax with a `wallpaper { }` block.
# The `preload = ...` / `wallpaper = MONITOR,path` form found in most guides is
# several versions stale: it parses without error and then silently paints
# nothing, logging only "Monitor X has no target: no wp will be created".
#
# An empty `monitor` applies to every output. Naming outputs is brittle here --
# the second display has appeared as both DP-4 and DP-5 across replugs, and a
# stale name fails the same silent way.

wallpaper {
    monitor =
    path = /home/mike/Pictures/wallpaper/hd/wallpaper.png
    fit_mode = cover
}

splash = false
