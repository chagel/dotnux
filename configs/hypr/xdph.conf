# xdg-desktop-portal-hyprland. Read from ~/.config/hypr/xdph.conf, which is a
# symlink to this file.

screencopy {
    # Capture into shared memory instead of DMA-BUF.
    #
    # This machine sets AQ_NO_MODIFIERS=1 (see configs/fish/user.fish) to stop
    # mesa handing aquamarine Y_TILED_CCS buffers the kernel rejects on the
    # dock's DP connector. That pins Hyprland to linear buffers, and the
    # portal's DMA-BUF path could not negotiate a working format against it:
    # screen sharing opened a session, logged "Sharing initialized", then tore
    # it straight back down with "Stream destroyed"/"Session destroyed" in the
    # same second. Zoom announced the share to participants and sent no frames,
    # so everyone else just saw a spinner.
    #
    # SHM copies through the CPU, so it costs more CPU and caps effective frame
    # rate versus a zero-copy DMA-BUF path. That is the price of the modifier
    # workaround; if AQ_NO_MODIFIERS is ever dropped, try turning this off.
    force_shm = true
}
