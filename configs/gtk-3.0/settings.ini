# GTK3 apps -- Evolution among them -- do not read the
# org.freedesktop.appearance color-scheme preference that GTK4/libadwaita apps
# pick up through the settings portal, so they need telling separately.
#
# The GTK4 side is driven by dconf instead, not a file:
#   gsettings set org.gnome.desktop.interface color-scheme prefer-dark
# which is what GNOME Calendar and other libadwaita apps follow.
[Settings]
gtk-application-prefer-dark-theme=1
