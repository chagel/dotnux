# Candidate window theme. "omarchy" is a generated theme whose theme.conf is a
# symlink to ~/.local/state/omarchy/current/theme/fcitx5.conf, rendered from
# ~/.config/omarchy/themed/fcitx5.conf.tpl on every theme switch.
Theme=omarchy
Font=JetBrainsMono Nerd Font 10
MenuFont=JetBrainsMono Nerd Font 10
TrayFont=JetBrainsMono Nerd Font 10
