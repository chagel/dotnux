# Flags sourced by /usr/bin/google-chrome-stable at launch (Arch's google-chrome
# package reads this file). Applies to every launch path -- app launcher, CLI,
# and xdg-open -- so no .desktop override is needed.
#
# One flag per line. Lines starting with # are ignored.

# Run natively on Wayland instead of XWayland, so Chrome renders sharp rather
# than being upscaled from XWayland under the global GDK_SCALE.
# "hint=auto" falls back to X11 automatically if Wayland is unavailable.
--ozone-platform-hint=auto

# No --force-device-scale-factor here. It scales the whole browser -- tabs,
# toolbar, menus and page alike -- which made the UI oversized when only page
# text needed help on the unscaled 4K panels. Page content is instead handled by
# Chrome's own default zoom (chrome://settings/appearance -> Page zoom), which
# lives in the profile rather than a flag, so it is not tracked in this repo.

# Let fcitx5 reach Wayland windows, so Chinese input works in page text fields.
# Without this, IME input silently does nothing on native Wayland.
--enable-wayland-ime

# Use GTK4 for file pickers and native dialogs, matching the rest of the desktop.
--gtk-version=4

# --- Optional: uncomment to taste -------------------------------------------

# Force dark UI and dark internal pages (settings, new tab, downloads).
#--force-dark-mode
#--enable-features=WebUIDarkMode

# Smooth two-finger back/forward swipe on the touchpad.
#--enable-features=TouchpadOverscrollHistoryNavigation

# Password storage. There is no secret service on this system (no gnome-keyring
# or kwallet), so Chrome's autodetection has nothing to bind to. Setting this
# explicitly skips the detection attempt.
# NOTE: "basic" means saved passwords are obfuscated in the profile, not
# encrypted -- anything that can read your home directory can read them. If you
# use Chrome's password manager, install gnome-keyring and use
# --password-store=gnome-libsecret instead.
#--password-store=basic
